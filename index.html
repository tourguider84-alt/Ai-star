<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XAUUSD AI - Long Short Draw - 106542197</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{background:#111;padding:10px;border-bottom:3px solid #ffc300;display:flex;justify-content:space-between;font-size:13px}
.card{background:#111;margin:8px;padding:10px;border-radius:12px;border:1px solid #222}

.line{position:absolute;left:0;right:0;height:2px;display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:11px;font-weight:800}
.entryLine{background:#3a7bff;top:50%}
.slLine{background:#ff3b3b}
.tpLine{background:#00ff88;color:#000}
.zone{position:absolute;left:0;right:50px;opacity:0.3}
.tpZone{background:#00ff88}
.slZone{background:#ff3b3b}
.priceTag{position:absolute;right:0;background:#333;padding:4px 6px;font-size:11px;font-weight:800;border-radius:4px}
.fbsBtn{display:block;background:#00b300;color:#fff;text-align:center;padding:16px;border-radius:10px;text-decoration:none;font-weight:900;margin-top:10px}
</style>
</head>
<body>

<div class="top">
<div><b style="color:#ffc300">XAUUSD AI 4H - LONG/SHORT DRAW</b><br>106542197 | FBS-Demo | 0788245106</div>
<div style="color:#00ff88">● LIVE</div>
</div>

<div class="card" style="border:2px solid #ffc300">
<button class="scanBtn" onclick="scan()">🔍 CLICK TO SCAN XAUUSD 4H</button>
<div id="status" style="text-align:center;margin-top:8px;color:#aaa;font-size:12px">Ready - Will draw Long/Short Position</div>

<div style="background:#001a0a;padding:8px;border-radius:8px;border:1px solid #00ff88"><div style="color:#00ff88">TAKE PROFIT</div><div class="big" id="TP" style="font-size:18px;color:#00ff88">-</div><div style="font-size:10px">+150 / +300 pips<br>BE after +50 pips</div></div>
</div>

<a class="fbsBtn" href="https://fbs.com/cabinet/login" target="_blank">🚀 TRADE THIS DRAW ON FBS<br>Account: 106542197 FBS-Demo<br><small>Tap to Login & Open MT5 XAUUSD</small></a>
</div>
</div>

<script>
let live=4118.82;
function scan(){
let status=document.getElementById('status'),res=document.getElementById('result'),ctrl=document.getElementById('control'),box=document.getElementById('drawBox');
status.innerHTML="⏳ Scanning 4H... Hammer / Shooting Star... RSI...";
setTimeout(()=>{
res.style.display="block";
let isBuy=Math.random()>0.5; // For demo: random buy/sell. You can make logic: live < 4100 = buy
let entry=4118.82, sl, tp1, tp2;

if(isBuy){
// LONG POSITION DRAW - Like TradingView Long tool
sl=entry-15; tp1=entry+25; tp2=entry+50;
ctrl.innerHTML="<span style='background:#00ff88;color:#000;padding:4px 12px;border-radius:20px'>✅ BUYERS IN CONTROL - LONG</span><br><small>Blue Block + Hammer + RSI 33</small>";
ctrl.style.background="#002a12"; ctrl.style.border="2px solid #00ff88";

box.innerHTML=`
<div class="zone tpZone" style="top:10%;height:35%;"></div>
<div class="line tpLine" style="top:10%"><span>TP2 +50 pips</span><span>${tp2.toFixed(2)}</span></div>

<div class="zone slZone" style="top:52%;height:25%;"></div>
<div class="line slLine" style="top:75%"><span>SL -15 pips - Risk</span><span>${sl.toFixed(2)}</span></div>
<div class="priceTag" style="top:8%;background:#00ff88;color:#000">TP2 ${tp2.toFixed(2)}</div>

<div style="position:absolute;left:50%;top:60%;color:#ff3b3b;font-weight:900;font-size:12px">▼ STOP -0.36%</div>
`;

document.getElementById('E').innerText=entry.toFixed(2);
document.getElementById('SL').innerText=sl.toFixed(2);
document.getElementById('TP').innerText=tp1.toFixed(2)+" / "+tp2.toFixed(2);

}else{
// SHORT POSITION DRAW
sl=entry+15; tp1=entry-25; tp2=entry-50;
ctrl.innerHTML="<span style='background:#ff3b3b;color:#fff;padding:4px 12px;border-radius:20px'>🔻 SELLERS IN CONTROL - SHORT</span><br><small>Orange Block + Shooting Star + RSI 71</small>";
ctrl.style.background="#2a0000"; ctrl.style.border="2px solid #ff3b3b";

box.innerHTML=`
<div class="zone slZone" style="top:10%;height:25%;"></div>
<div class="line slLine" style="top:10%"><span>SL +15 pips - Risk</span><span>${sl.toFixed(2)}</span></div>
<div class="line entryLine" style="top:35%"><span>ENTRY - SHORT</span><span>${entry.toFixed(2)}</span></div>
<div class="zone tpZone" style="top:37%;height:50%;"></div>
<div class="line tpLine" style="top:60%;background:#00cc66"><span>TP1 -25 pips - Close 50%</span><span>${tp1.toFixed(2)}</span></div>
<div class="line tpLine" style="top:85%"><span>TP2 -50 pips</span><span>${tp2.toFixed(2)}</span></div>

<div style="position:absolute;left:50%;top:55%;color:#00ff88;font-weight:900;font-size:12px">▲ SHORT +1.21%</div>
`;

document.getElementById('E').innerText=entry.toFixed(2);
document.getElementById('SL').innerText=sl.toFixed(2);
document.getElementById('TP').innerText=tp1.toFixed(2)+" / "+tp2.toFixed(2);
}

status.innerHTML="✅ SCAN DONE - "+(isBuy?"LONG POSITION DRAWN - BUYERS":"SHORT POSITION DRAWN - SELLERS");
status.style.color=isBuy?"#00ff88":"#ff3b3b";
box.scrollIntoView({behavior:'smooth'});

},1200);
}
</script>

</body>
</html>
